server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Docker's internal DNS; resolving at request time means nginx still starts
  # even if the API container is a few seconds late.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:5000;

  # ---- API ----
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ---- Live notifications (WebSocket) ----
  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  location = /health {
    proxy_pass $api_upstream;
  }

  # ---- Static assets: hashed filenames, cache for a year ----
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ---- SPA fallback: /admin, /my-complaints ... all serve index.html ----
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
